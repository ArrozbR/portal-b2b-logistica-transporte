# Portal de desenvolvimento do Grupo 5: serve as telas e faz o papel do gateway
# do kit, repartindo as chamadas entre as duas cópias de cada serviço.
# Se uma cópia cair, o Nginx manda a requisição para a outra.
#
# Este arquivo é um modelo: ao subir, o Nginx troca ${AUTH_URL} pelo endereço da
# Autenticação (padrão: o usuarios-falso; ver docker-compose.yml). Os falsos são
# procurados a cada requisição (resolver do Docker), então o portal sobe mesmo
# sem eles: sem o falso, a rota responde 502 e a tela esconde o que depende dele.

upstream logistica {
    server logistica-1:8108 max_fails=1 fail_timeout=10s;
    server logistica-2:8108 max_fails=1 fail_timeout=10s;
}

upstream transportadoras {
    server transportadoras-1:8109 max_fails=1 fail_timeout=10s;
    server transportadoras-2:8109 max_fails=1 fail_timeout=10s;
}

# Repassa o X-Correlation-Id recebido ou gera um novo (como o gateway do kit).
map $http_x_correlation_id $correlacao {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $correlacao;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503;

    location /api/v1/logistica/ {
        proxy_pass http://logistica;
    }

    location /api/v1/transportadoras {
        proxy_pass http://transportadoras;
    }

    # DNS do Docker: nomes resolvidos na hora da requisição (contêiner que não existe → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Login, troca de contexto, renovação e logout (D28): o usuarios-falso ou o
    # Identity-Service real, conforme AUTH_URL.
    location /api/v1/auth/ {
        set $autenticacao ${AUTH_URL};
        proxy_pass $autenticacao;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }

    # Chaves públicas dos tokens, no mesmo caminho do gateway do kit (D25).
    location = /.well-known/jwks.json {
        set $autenticacao ${AUTH_URL};
        proxy_pass $autenticacao;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
    }

    # Só desenvolvimento: usuários de demonstração (usuarios-falso).
    location /api/v1/usuarios/ {
        set $usuarios http://usuarios-falso:8101;
        proxy_pass $usuarios;
    }

    # Só desenvolvimento: papel do grupo de Pedidos (D23), pedidos de teste do admin.
    location /api/v1/pedidos-falso/ {
        set $pedidos http://pedidos-falso:8102;
        proxy_pass $pedidos;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
