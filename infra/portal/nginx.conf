# Portal de desenvolvimento do Grupo 5: serve as telas e faz o papel do gateway
# do kit, repartindo as chamadas entre as duas cópias de cada serviço.
# Se uma cópia cair, o Nginx manda a requisição para a outra.

upstream logistica {
    server logistica-1:8108 max_fails=1 fail_timeout=10s;
    server logistica-2:8108 max_fails=1 fail_timeout=10s;
}

upstream transportadoras {
    server transportadoras-1:8109 max_fails=1 fail_timeout=10s;
    server transportadoras-2:8109 max_fails=1 fail_timeout=10s;
}

upstream usuarios {
    server usuarios-falso:8101;
}

# Papel do grupo de Pedidos no desenvolvimento (D23): pedidos de teste do admin.
upstream pedidos {
    server pedidos-falso:8102;
}

# Repassa o X-Correlation-Id recebido ou gera um novo (como o gateway do kit).
map $http_x_correlation_id $correlacao {
    default $http_x_correlation_id;
    ""      $request_id;
}

server {
    listen 80;
    server_name _;

    proxy_set_header Host $host;
    proxy_set_header X-Correlation-Id $correlacao;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503;

    location /api/v1/logistica/ {
        proxy_pass http://logistica;
    }

    location /api/v1/transportadoras {
        proxy_pass http://transportadoras;
    }

    location /api/v1/usuarios/ {
        proxy_pass http://usuarios;
    }

    location /api/v1/pedidos-falso/ {
        proxy_pass http://pedidos;
    }

    # Chaves públicas dos tokens, no mesmo caminho do gateway do kit (D25).
    location = /.well-known/jwks.json {
        proxy_pass http://usuarios;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
