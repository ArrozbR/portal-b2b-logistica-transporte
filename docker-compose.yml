# Ambiente de desenvolvimento do Grupo 5 (Logística e Transporte).
#
# Sobe um Postgres e um Redpanda próprios e as DUAS cópias de cada serviço,
# como no kit (app1 e app2). As portas foram escolhidas para não conflitar
# com o kit de infraestrutura (que usa 5432, 19092 e 8090).
#
#   docker compose up -d --build     sobe tudo
#   docker compose logs -f logistica-1 transportadoras-1
#   docker compose down -v           derruba e apaga os dados
#
# Senhas e segredos: copie .env.example para .env (os valores padrão abaixo
# servem só para desenvolvimento local).

name: logistica-grupo5

x-servico: &servico
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    topicos:
      condition: service_completed_successfully

x-ambiente: &ambiente
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: portal_b2b
  DB_POOL_MAX: "5"
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-somente-desenvolvimento-local-troque-esta-chave}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-ambiente-logistica: &ambiente-logistica
  <<: *ambiente
  SERVICE_NAME: logistica-service
  DB_USER: svc_logistica
  DB_PASSWORD: ${SVC_LOGISTICA_SENHA:-dev-logistica}
  RODADA_COTACAO_SEGUNDOS: ${RODADA_COTACAO_SEGUNDOS:-10}
  PRAZO_DECISAO_SEGUNDOS: ${PRAZO_DECISAO_SEGUNDOS:-43200}

x-ambiente-transportadoras: &ambiente-transportadoras
  <<: *ambiente
  SERVICE_NAME: transportadoras-service
  DB_USER: svc_transportadoras
  DB_PASSWORD: ${SVC_TRANSPORTADORAS_SENHA:-dev-transportadoras}
  RASTREIO_INTERVALO_SEGUNDOS: ${RASTREIO_INTERVALO_SEGUNDOS:-30}

services:
  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: grupo5/postgres-dev:16.4
    environment:
      POSTGRES_DB: portal_b2b
      POSTGRES_USER: portal_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-admin}
      PORTAL_DDL_SENHA: ${PORTAL_DDL_SENHA:-dev-ddl}
      SVC_LOGISTICA_SENHA: ${SVC_LOGISTICA_SENHA:-dev-logistica}
      SVC_TRANSPORTADORAS_SENHA: ${SVC_TRANSPORTADORAS_SENHA:-dev-transportadoras}
    ports:
      - "15432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      # -h localhost: só fica pronto quando o servidor final escuta em TCP,
      # depois de rodar os scripts de inicialização.
      test: ["CMD-SHELL", "pg_isready -h localhost -U portal_admin -d portal_b2b"]
      interval: 3s
      timeout: 3s
      retries: 40

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=interno://0.0.0.0:9092,externo://0.0.0.0:29092
      - --advertise-kafka-addr=interno://redpanda:9092,externo://localhost:29092
      - --default-log-level=warn
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 40

  topicos:
    build:
      context: .
      dockerfile: infra/redpanda/Dockerfile
    image: grupo5/topicos-dev:latest
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8091:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  logistica-1:
    <<: *servico
    build:
      context: .
      dockerfile: services/logistica-service/Dockerfile
    image: grupo5/logistica-service:dev
    environment:
      <<: *ambiente-logistica
      INSTANCIA: app1
    ports:
      - "8108:8108"

  logistica-2:
    <<: *servico
    image: grupo5/logistica-service:dev
    pull_policy: never
    environment:
      <<: *ambiente-logistica
      INSTANCIA: app2
    ports:
      - "8118:8108"

  transportadoras-1:
    <<: *servico
    build:
      context: .
      dockerfile: services/transportadoras-service/Dockerfile
    image: grupo5/transportadoras-service:dev
    environment:
      <<: *ambiente-transportadoras
      INSTANCIA: app1
    ports:
      - "8109:8109"

  transportadoras-2:
    <<: *servico
    image: grupo5/transportadoras-service:dev
    pull_policy: never
    environment:
      <<: *ambiente-transportadoras
      INSTANCIA: app2
    ports:
      - "8119:8109"

  # Faz o papel do grupo de Pedidos na outra ponta (D23): registra as mudanças
  # de status do pedido e cancela o pedido quando chega frete_indisponivel.
  # Desligue quando o pedidos-service real estiver integrado.
  pedidos-falso:
    image: grupo5/logistica-service:dev
    pull_policy: never
    command: ["python", "-m", "comum.ferramentas.pedidos_falso"]
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    depends_on:
      topicos:
        condition: service_completed_successfully
      logistica-1:
        condition: service_started

  # SOMENTE DESENVOLVIMENTO: faz o papel do usuarios-service no login da tela.
  usuarios-falso:
    image: grupo5/logistica-service:dev
    pull_policy: never
    command: ["uvicorn", "comum.ferramentas.usuarios_falso:app", "--host", "0.0.0.0", "--port", "8101"]
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-somente-desenvolvimento-local-troque-esta-chave}
    depends_on:
      logistica-1:
        condition: service_started

  # Telas do módulo + gateway: reparte as chamadas entre as duas cópias de cada
  # serviço, como o Nginx do kit. Abra http://localhost:8088
  portal:
    build:
      context: .
      dockerfile: infra/portal/Dockerfile
    image: grupo5/portal-dev:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      logistica-1:
        condition: service_started
      logistica-2:
        condition: service_started
      transportadoras-1:
        condition: service_started
      transportadoras-2:
        condition: service_started
      usuarios-falso:
        condition: service_started

volumes:
  dados-postgres:
