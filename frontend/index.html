<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entregas · Portal B2B</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12.5' fill='none' stroke='%239be800' stroke-width='7' stroke-dasharray='58.9 19.6' transform='rotate(15 16 16)'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/portal.css">
</head>
<body>
  <div class="app">
    <aside class="lateral" id="lateral"></aside>
    <div class="principal">
      <header class="topo" id="topo"></header>
      <main class="conteudo" id="conteudo">
        <div class="cabecalho">
          <div>
            <h1>Entregas</h1>
            <p>Acompanhe o transporte dos pedidos depois que o frete é escolhido.</p>
          </div>
        </div>
        <div class="filtros" id="filtros" role="tablist" aria-label="Filtrar entregas">
          <button type="button" data-filtro="todas" class="ativo">Todas</button>
          <button type="button" data-filtro="andamento">Em andamento</button>
          <button type="button" data-filtro="entregues">Entregues</button>
          <button type="button" data-filtro="canceladas">Canceladas</button>
        </div>
        <div id="mensagem"></div>
        <section class="cartao" aria-live="polite">
          <div id="lista" class="carregando">Carregando entregas…</div>
        </section>
      </main>
    </div>
  </div>
  <script src="assets/portal.js"></script>
  <script src="assets/entregas.js"></script>
</body>
</html>
